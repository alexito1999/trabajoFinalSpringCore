<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head(cssExtra='preguntas')}">
    <title>Preguntas</title>
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container py-5">
        <div class="list-header">
            <div class="d-flex align-items-center gap-3">
                <h4 class="fw-bold mb-0">Listado de Preguntas</h4>
                <span class="badge-count" th:text="${pagina.totalElements} + ' preguntas'">0 preguntas</span>
            </div>
            <a th:if="${autenticado}" th:href="@{/pregunta/nueva}" class="btn-submit btn-submit-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2z"/>
                </svg>
                Nueva
            </a>
        </div>

        <div class="filters-card">
            <form th:action="@{/pregunta/listar}" method="get" class="filters-bar" onsubmit="return limpiarFiltros(this)">
                <div class="filters-row">
                    <div class="filter-group">
                        <label class="filter-label">Buscar</label>
                        <input type="text" name="texto" class="form-control filter-select" placeholder="Buscar por texto..."
                               th:value="${textoBusqueda}">
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Temática</label>
                        <select name="tematicaId" class="form-select filter-select">
                            <option value="">Todas las temáticas</option>
                            <option th:each="t : ${tematicas}" th:value="${t.id}" th:text="${t.nombre}"
                                    th:selected="${tematicaId == t.id}"></option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Tipo</label>
                        <select name="tipo" class="form-select filter-select">
                            <option value="">Todos los tipos</option>
                            <option value="VF" th:selected="${tipoFiltro == 'VF'}">Verdadero / Falso</option>
                            <option value="SU" th:selected="${tipoFiltro == 'SU'}">Selección única</option>
                            <option value="SM" th:selected="${tipoFiltro == 'SM'}">Selección múltiple</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-filter">Filtrar</button>
                    <a th:href="@{/pregunta/listar}" class="btn-filter-reset" title="Limpiar filtros">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 3.5a4.5 4.5 0 0 0-4.5 4.5.5.5 0 0 1-1 0A5.5 5.5 0 0 1 8 2.5V1l2.5 2L8 5V3.5z"/>
                            <path d="M8 12.5A4.5 4.5 0 0 0 12.5 8a.5.5 0 0 1 1 0 5.5 5.5 0 0 1-5.5 5.5V15l-2.5-2 2.5-2v1.5z"/>
                        </svg>
                    </a>
                </div>
            </form>
        </div>
        <script>
            function limpiarFiltros(form) {
                var selects = form.querySelectorAll('select');
                for (var i = 0; i < selects.length; i++) {
                    if (selects[i].value === '') {
                        selects[i].disabled = true;
                    }
                }
                var inputs = form.querySelectorAll('input[type="text"]');
                for (var i = 0; i < inputs.length; i++) {
                    if (inputs[i].value === '') {
                        inputs[i].disabled = true;
                    }
                }
                return true;
            }
        </script>

        <div class="row g-3 questions-grid">
            <div th:each="pregunta : ${pagina.content}" class="col-md-6 col-lg-4">
                <div class="question-card" th:classappend="|q-accent-${pregunta.tipo}|">
                    <div class="question-card-accent"></div>
                    <div class="question-card-header">
                        <span class="badge-type" th:classappend="|badge-${pregunta.tipo}|" th:text="${pregunta.mostrarTipo()}">Tipo</span>
                        <span class="badge-topic" th:if="${pregunta.tematica}" th:text="${pregunta.tematica.nombre}">Temática</span>
                    </div>
                    <p class="question-text" th:text="${pregunta.enunciado}">Enunciado</p>
                    <div th:if="${esAdmin}" class="question-card-actions">
                        <a th:href="@{/pregunta/editar/{id}(id=${pregunta.id})}" class="btn-action btn-action-edit">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325"/>
                            </svg>
                            Editar
                        </a>
                        <form th:action="@{/pregunta/borrar/{id}(id=${pregunta.id})}" method="post" onsubmit="return confirm('¿Eliminar esta pregunta?')">
                            <button type="submit" class="btn-action btn-action-delete">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                                    <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                                </svg>
                                Eliminar
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${pagina.totalElements == 0}" class="empty-state">
            <div class="empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M14 1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4.414A2 2 0 0 0 3 11.586l-2 2V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12.793a.5.5 0 0 0 .854.353l2.853-2.853A1 1 0 0 1 4.414 12H14a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                </svg>
            </div>
            <p class="empty-title">No hay preguntas</p>
            <p class="text-muted mb-0">Aún no se ha registrado ninguna pregunta.</p>
            <a th:if="${autenticado}" th:href="@{/pregunta/nueva}" class="btn-submit btn-submit-sm mt-3">Crear primera pregunta</a>
        </div>

        <nav th:if="${pagina.totalPages > 1}" class="mt-4">
            <ul class="pagination-custom">
                <li th:classappend="${pagina.first} ? 'disabled'">
                    <a class="page-btn" th:href="@{/pregunta/listar(page=${pagina.number - 1}, size=${pagina.size}, tematicaId=${tematicaId}, tipo=${tipoFiltro}, texto=${textoBusqueda})}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
                        </svg>
                    </a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}"
                    th:classappend="${i == pagina.number} ? 'active'">
                    <a class="page-btn" th:href="@{/pregunta/listar(page=${i}, size=${pagina.size}, tematicaId=${tematicaId}, tipo=${tipoFiltro}, texto=${textoBusqueda})}" th:text="${i + 1}">1</a>
                </li>
                <li th:classappend="${pagina.last} ? 'disabled'">
                    <a class="page-btn" th:href="@{/pregunta/listar(page=${pagina.number + 1}, size=${pagina.size}, tematicaId=${tematicaId}, tipo=${tipoFiltro}, texto=${textoBusqueda})}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
                        </svg>
                    </a>
                </li>
            </ul>
        </nav>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <div class="container">
            <p class="mb-0 small">&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> Trabajo Final &mdash; Todos los derechos reservados</p>
        </div>
    </footer>

    <div th:replace="~{fragments/header :: scripts}"></div>
</body>

</html>
