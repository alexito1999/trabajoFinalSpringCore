<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}">
    <title>Error interno</title>
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container py-5">
        <div class="text-center py-5">
            <div class="mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="#dc3545" viewBox="0 0 16 16">
                    <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16M4.5 5.5a1 1 0 1 1 2 0 1 1 0 0 1-2 0m6 0a1 1 0 1 1 2 0 1 1 0 0 1-2 0M4.5 9.5a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5"/>
                </svg>
            </div>
            <h1 class="display-4 fw-bold text-danger mb-3">500</h1>
            <div th:if="${mensaje}">
                <p class="fs-5 mb-1" th:text="${mensaje}">Error interno del servidor</p>
                <p class="text-muted" th:text="${detalle}">Ocurrió un error inesperado.</p>
            </div>
            <p th:unless="${mensaje}" class="fs-5 text-muted mb-3">Algo salió mal. Inténtalo de nuevo más tarde.</p>
            <a th:href="@{/}" class="btn btn-primary mt-3">Volver al inicio</a>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small">&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> Trabajo Final</p>
        </div>
    </footer>

    <div th:replace="~{fragments/header :: scripts}"></div>
</body>

</html>
