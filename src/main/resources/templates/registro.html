<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main>
        <div class="container">
            <div class="row justify-content-center" style="padding-top: 4rem;">
                <div class="col-md-5 col-lg-4">
                    <div class="form-card">
                        <h2 class="section-title text-center mb-1">Crear cuenta</h2>
                        <p class="section-desc text-center mb-4">Registrate para acceder</p>

                        <div th:if="${error}" class="alert alert-danger py-2 small text-center mb-3" th:text="${error}"></div>

                        <form th:action="@{/registro}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" name="username" class="form-control" required minlength="3" autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contrase&ntilde;a</label>
                                <input type="password" name="password" class="form-control" required minlength="6">
                            </div>
                            <button type="submit" class="btn-submit w-100">Crear cuenta</button>
                        </form>

                        <p class="text-center mt-3 mb-0 small">
                            Ya ten&eacute;s cuenta?
                            <a th:href="@{/login}" class="text-decoration-none" style="color:#6c63ff">Iniciar sesi&oacute;n</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
