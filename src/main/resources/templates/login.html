<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main>
        <div class="container">
            <div class="row justify-content-center" style="padding-top: 4rem;">
                <div class="col-md-5 col-lg-4">
                    <div class="form-card">
                        <h2 class="section-title text-center mb-1">Iniciar sesi&oacute;n</h2>
                        <p class="section-desc text-center mb-4">Ingres&aacute; con tu cuenta</p>

                        <div th:if="${param.registrado}" class="alert alert-success py-2 small text-center mb-3">
                            Registro exitoso. Inici&aacute; sesi&oacute;n.
                        </div>
                        <div th:if="${param.error}" class="alert alert-danger py-2 small text-center mb-3">
                            Usuario o contrase&ntilde;a incorrectos.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-info py-2 small text-center mb-3">
                            Sesion cerrada.
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" name="username" class="form-control" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contrase&ntilde;a</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn-submit w-100">Ingresar</button>
                        </form>

                        <p class="text-center mt-3 mb-0 small">
                            <a th:href="@{/registro}" class="text-decoration-none" style="color:#6c63ff">Registrarse</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/header :: scripts}"></div>
</body>
</html>
