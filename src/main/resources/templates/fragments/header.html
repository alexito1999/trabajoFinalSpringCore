<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} ?: 'Trabajo Final'">Trabajo Final</title>
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

    <nav th:fragment="navbar" class="navbar position-relative">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <span class="brand-icon">TF</span>
            </a>

            <div class="d-flex align-items-center gap-3">
                <a class="nav-btn nav-btn-jugar" th:href="@{/jugar}">Jugar</a>

                <a class="nav-btn" th:href="@{/}">Inicio</a>
                <div class="dropdown-wrap">
                    <button class="menu-btn d-flex align-items-center gap-1" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                        th:aria-label="${autenticado} ? 'Menú de usuario' : 'Menú de invitado'">
                        <span th:unless="${autenticado}" class="d-flex align-items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                viewBox="0 0 16 16">
                                <path
                                    d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
                            </svg>
                            <span>Invitado</span>
                        </span>
                        <span th:if="${autenticado}" class="username-label" th:text="${username}">Usuario</span>
                        <svg class="menu-chevron" xmlns="http://www.w3.org/2000/svg" width="10" height="10"
                            fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 12 2 4h12z" />
                        </svg>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item" th:if="${autenticado}">
                                <a class="nav-link" th:classappend="${activePreguntas} ? 'active'"
                                    th:href="@{/pregunta/listar}">Preguntas</a>
                            </li>
                            <li th:if="${autenticado}" class="nav-divider" role="separator" aria-orientation="horizontal">
                            </li>
                            <li class="nav-item" th:if="${autenticado}">
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="nav-link logout-link"
                                        style="border:none;background:none;width:100%;text-align:left;cursor:pointer">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                            fill="currentColor" viewBox="0 0 16 16" class="me-1">
                                            <path
                                                d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z" />
                                            <path
                                                d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z" />
                                        </svg>
                                        Cerrar sesi&oacute;n
                                    </button>
                                </form>
                            </li>
                            <li th:unless="${autenticado}" class="nav-divider" role="separator" aria-orientation="horizontal">
                            </li>
                            <li class="nav-item" th:unless="${autenticado}">
                                <a class="nav-link" th:href="@{/login}">Ingresar</a>
                            </li>
                            <li class="nav-item" th:unless="${autenticado}">
                                <a class="nav-link" th:href="@{/registro}">Registrarse</a>
                            </li>
                        </ul>
                    </div>
                </div>
        <div th:if="${activeProfile == 'dev'}" class="dev-badge">DEV</div>
    </nav>

    <script th:fragment="scripts" th:src="@{/bootstrap-5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
