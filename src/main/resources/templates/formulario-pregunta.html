<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}">
    <title th:text="${form.id != null} ? 'Editar Pregunta' : 'Nueva Pregunta'">Formulario</title>
</head>

<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <a th:href="@{/pregunta/listar}" class="btn-back" title="Volver">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                            viewBox="0 0 16 16">
                            <path fill-rule="evenodd"
                                d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z" />
                        </svg>
                    </a>
                    <h4 class="fw-bold mb-0" th:text="${form.id != null} ? 'Editar Pregunta' : 'Nueva Pregunta'">
                        Formulario</h4>
                </div>

                <form th:action="@{/pregunta/guardar}" th:object="${form}" method="post" class="form-card">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label for="enunciado" class="form-label fw-semibold">Enunciado</label>
                        <textarea id="enunciado" th:field="*{enunciado}" class="form-control"
                            th:classappend="${#fields.hasErrors('enunciado')} ? 'is-invalid'" rows="3"
                            placeholder="Escribe la pregunta..."></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('enunciado')}"
                            th:errors="*{enunciado}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tipo de pregunta</label>
                        <div class="tipo-pills">
                            <label class="tipo-pill"
                                th:classappend="${form.tipo == null || form.tipo == 'VF'} ? 'active'">
                                <input type="radio" name="tipo" value="VF"
                                    th:checked="${form.tipo == null || form.tipo == 'VF'}"
                                    onchange="mostrarCamposTipo()">
                                Verdadero / Falso
                            </label>
                            <label class="tipo-pill" th:classappend="${form.tipo == 'SU'} ? 'active'">
                                <input type="radio" name="tipo" value="SU" th:checked="${form.tipo == 'SU'}"
                                    onchange="mostrarCamposTipo()">
                                Selección única
                            </label>
                            <label class="tipo-pill" th:classappend="${form.tipo == 'SM'} ? 'active'">
                                <input type="radio" name="tipo" value="SM" th:checked="${form.tipo == 'SM'}"
                                    onchange="mostrarCamposTipo()">
                                Selección múltiple
                            </label>
                        </div>
                    </div>

                    <div id="camposVF" class="mb-3">
                        <label class="form-label fw-semibold">Respuesta correcta</label>
                        <div class="tipo-pills">
                            <label class="tipo-pill" th:classappend="${form.correcto} ? 'active'">
                                <input type="radio" name="correcto" value="true" th:checked="${form.correcto}">
                                Verdadero
                            </label>
                            <label class="tipo-pill" th:classappend="${!form.correcto} ? 'active'">
                                <input type="radio" name="correcto" value="false" th:checked="${!form.correcto}">
                                Falso
                            </label>
                        </div>
                    </div>

                    <div id="camposOpciones" class="mb-3" style="display:none;">
                        <label class="form-label fw-semibold">Opciones</label>
                        <div id="opcionesContainer" class="opciones-container">
                        </div>
                        <button type="button" class="btn-add-option mt-2" onclick="agregarOpcion()">

                            <!-- icono + -->
                            <svg class="icon-plus" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                fill="currentColor" viewBox="0 0 16 16">
                                <path
                                    d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2z" />
                            </svg>

                            Añadir opción

                            <!-- borde animado -->
                            <svg class="border-svg">
                                <rect x="0.75" y="0.75" width="calc(100% - 1.5px)" height="calc(100% - 1.5px)" />
                            </svg>

                        </button>
                    </div>

                    <div class="mb-4">
                        <label for="tematicaId" class="form-label fw-semibold">Temática</label>
                        <select id="tematicaId" th:field="*{tematicaId}" class="form-select"
                            th:classappend="${#fields.hasErrors('tematicaId')} ? 'is-invalid'" required>
                            <option value="">Selecciona una temática</option>
                            <option th:each="t : ${tematicas}" th:value="${t.id}" th:text="${t.nombre}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('tematicaId')}"
                            th:errors="*{tematicaId}"></div>
                    </div>

                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger py-2 mb-3">
                        Corrige los errores antes de guardar.
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn-submit"
                            th:text="${form.id != null} ? 'Guardar cambios' : 'Crear pregunta'">Guardar</button>
                        <a th:href="@{/pregunta/listar}" class="btn-cancel">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small">&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> Trabajo Final
                &mdash; Todos los derechos reservados</p>
        </div>
    </footer>

    <div th:replace="~{fragments/header :: scripts}"></div>

   <script th:inline="javascript">

    const opcionesIniciales = /*[[${form.opciones}]]*/ [];

    const container =
        document.getElementById('opcionesContainer');

    let draggedRow = null;

    function obtenerTipoPregunta() {

        return document.querySelector(
            'input[name="tipo"]:checked'
        )?.value;

    }

    function mostrarCamposTipo() {

        const tipo = obtenerTipoPregunta();

        document.getElementById('camposVF').style.display =
            tipo === 'VF' ? 'block' : 'none';

        document.getElementById('camposOpciones').style.display =
            ['SU', 'SM'].includes(tipo)
                ? 'block'
                : 'none';

    }

    function crearCheckCorrecta(index) {

        const tipo = obtenerTipoPregunta();

        return `
            <div class="opcion-check">

                <input
                    type="${tipo === 'SU' ? 'radio' : 'checkbox'}"
                    class="correcta-check"
                    name="${tipo === 'SU'
                        ? 'opcionCorrecta'
                        : 'opcionesCorrectas'}"
                    value="${index}">

            </div>
        `;
    }

    function agregarOpcion(valor = '') {

        const index = container.children.length;

        const div = document.createElement('div');

        div.className = 'opcion-item';

        div.draggable = true;

        div.dataset.index = index;

        div.innerHTML = `

            <span class="drag-handle">
                &#x2807;
            </span>

            ${crearCheckCorrecta(index)}

            <input
                type="text"
                name="opciones[${index}]"
                class="form-control opcion-input"
                placeholder="Opción ${index + 1}"
                value="${valor}">

            <button
                type="button"
                class="btn-remove-option">

                ×

            </button>
        `;

        div.querySelector('.btn-remove-option')
            .addEventListener('click', () => eliminarOpcion(div));

        agregarEventosDrag(div);

        container.appendChild(div);

    }

    function eliminarOpcion(row) {

        if (container.children.length <= 2) return;

        row.remove();

        reindexarOpciones();

    }

    function reindexarOpciones() {

        [...container.children].forEach((row, i) => {

            row.dataset.index = i;

            const input =
                row.querySelector('.opcion-input');

            const check =
                row.querySelector('.correcta-check');

            input.name = `opciones[${i}]`;

            input.placeholder = `Opción ${i + 1}`;

            check.value = i;

        });

    }

    function agregarEventosDrag(row) {

        row.addEventListener('dragstart', () => {

            draggedRow = row;

            row.classList.add('dragging');

        });

        row.addEventListener('dragover', e => {

            e.preventDefault();

            const rect = row.getBoundingClientRect();

            const mitad =
                rect.top + rect.height / 2;

            container.insertBefore(
                draggedRow,
                e.clientY < mitad
                    ? row
                    : row.nextSibling
            );

        });

        row.addEventListener('dragend', () => {

            draggedRow?.classList.remove('dragging');

            draggedRow = null;

            reindexarOpciones();

        });

    }

    function renderizarOpciones() {

        container.innerHTML = '';

        if (opcionesIniciales?.length) {

            opcionesIniciales
                .forEach(op => agregarOpcion(op));

        } else {

            agregarOpcion();
            agregarOpcion();

        }

    }

    renderizarOpciones();

    mostrarCamposTipo();

</script>
</body>

</html>
